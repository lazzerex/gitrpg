<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Git-RPG{{end}}</title>
    <meta name="description" content="{{block "meta_description" .}}Turn your GitHub commits, PRs, and reviews into a leveling RPG character with stats and shareable cards.{{end}}">
    <link rel="canonical" href="{{block "canonical_url" .}}{{.BaseURL}}/{{end}}">
    {{block "robots_meta" .}}{{end}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Git-RPG">
    <meta property="og:title" content="{{template "title" .}}">
    <meta property="og:description" content="{{template "meta_description" .}}">
    <meta property="og:url" content="{{template "canonical_url" .}}">
    <meta property="og:image" content="{{block "og_image" .}}{{.BaseURL}}/static/assets/gitrpg-logo.png{{end}}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
    </script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/css/base.css">
</head>
<body hx-boost="true">
    <a href="#main-content" class="skip-link">SKIP TO CONTENT</a>
    <div id="rpg-bg" aria-hidden="true">
        <div id="rpg-tile"></div>
        <div id="rpg-stars"></div>
        <div id="rpg-clouds"></div>
        <div id="rpg-hills"></div>
    </div>
    <nav style="background: var(--panel); border-bottom: 4px solid var(--border); position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 880px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 24px;">
            <a href="/" class="nav-logo" style="text-decoration:none;display:inline-flex;align-items:baseline;flex-shrink:0;gap:0;">
                <span class="nav-logo-git">GIT</span><span class="nav-logo-rpg">RPG</span>
            </a>
            <div style="display: flex; gap: 20px; align-items: center; flex: 1;">
                <a href="/cards" style="color: var(--muted); font-size: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                    <i aria-hidden="true" data-lucide="id-card" style="width:12px;height:12px;stroke:var(--muted);stroke-width:2;"></i>CARDS
                </a>
                <a href="/leaderboard" style="color: var(--muted); font-size: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                    <i aria-hidden="true" data-lucide="trophy" style="width:12px;height:12px;stroke:var(--muted);stroke-width:2;"></i>RANKS
                </a>
                {{if .User}}
                <a href="/play" style="color: var(--muted); font-size: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                    <i aria-hidden="true" data-lucide="swords" style="width:12px;height:12px;stroke:var(--muted);stroke-width:2;"></i>ARENA
                </a>
                <a href="/u/{{.User.Login}}" style="color: var(--muted); font-size: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                    <i aria-hidden="true" data-lucide="globe" style="width:12px;height:12px;stroke:var(--muted);stroke-width:2;"></i>PUBLIC
                </a>
                {{else}}
                <span title="SIGN IN TO TRY THE ARENA" style="color: var(--muted); opacity: 0.45; font-size: 8px; cursor: not-allowed; display: flex; align-items: center; gap: 6px;">
                    <i aria-hidden="true" data-lucide="lock" style="width:12px;height:12px;stroke:var(--muted);stroke-width:2;"></i>ARENA
                </span>
                {{end}}
            </div>
            <div style="display: flex; gap: 16px; align-items: center; flex-shrink: 0;">
                {{if .User}}
                    <a href="/profile" style="color: var(--cyan); font-size: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                        <i aria-hidden="true" data-lucide="user" style="width:12px;height:12px;stroke:var(--cyan);stroke-width:2;"></i>{{.User.Login}}
                    </a>
                    <a href="/logout" style="color: var(--muted); font-size: 8px; text-decoration: none;">LOGOUT</a>
                {{else}}
                    <a href="/auth/github" class="px-btn px-btn-gold" style="font-size: 8px; padding: 8px 14px;" hx-boost="false">LOGIN</a>
                {{end}}
            </div>
        </div>
    </nav>
    <main id="main-content">
        {{block "content" .}}{{end}}
    </main>
    <script src="/static/js/base.js"></script>
</body>
</html>
